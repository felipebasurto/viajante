[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "viajante"
version = "0.1.0"
description = "Local Google Flights and hotel search from any IATA pair (no API keys; currency is origin country or --currency; does not convert; asks when unproven)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "viajante contributors" }]
dependencies = [
    "airportsdata>=20260315",
    "curl-cffi>=0.16.0",
    "selectolax>=0.3.25",
]

[project.urls]
Homepage = "https://github.com/felipebasurto/viajante"
Repository = "https://github.com/felipebasurto/viajante"
Issues = "https://github.com/felipebasurto/viajante/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.6,<2"]
browser = ["playwright==1.60.0"]

[project.scripts]
viajante = "viajante.cli:main"
viajante-mcp = "viajante.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viajante = ["py.typed", "iata_rows.marshal"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[dependency-groups]
dev = [
    "mcp>=1.6,<2",
    "playwright==1.60.0",
    "pre-commit>=4.3.0",
    "ruff==0.15.12",
]
