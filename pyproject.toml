[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "viajante"
version = "1.5.0"
description = "Flight and hotel search for the terminal, Python, and AI assistants."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "viajante contributors" }]
dependencies = [
    "airportsdata>=20260315",
    "curl-cffi>=0.16.0",
    "selectolax>=0.3.25",
]

[project.urls]
Homepage = "https://github.com/felipebasurto/viajante"
Repository = "https://github.com/felipebasurto/viajante"
Documentation = "https://github.com/felipebasurto/viajante/blob/main/docs/usage.md"
Issues = "https://github.com/felipebasurto/viajante/issues"

[project.optional-dependencies]
mcp = ["mcp>=2.3.0,<3"]
browser = ["playwright==1.63.0"]

[project.scripts]
viajante = "viajante.cli:main"
viajante-mcp = "viajante.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viajante = ["py.typed", "iata_rows.marshal", "THIRD_PARTY_NOTICES"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[dependency-groups]
dev = [
    "mcp>=2.3.0,<3",
    "playwright==1.63.0",
    "pre-commit>=4.3.0",
    "ruff==0.16.10",
]
