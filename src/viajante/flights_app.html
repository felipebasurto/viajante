<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viajante flights</title>
<style>
/* Evidence view for search_flights. Text and envelope first; color only reinforces. */
:root {
  --bg: #f4f1ea;
  --surface: #fffdf8;
  --ink: #161513;
  --muted: #6b675e;
  --line: #e2dccd;
  --accent: #0f7a57;
  --accent-soft: #dcefe6;
  --warn: #b45309;
  --warn-soft: #f7ead6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171714;
    --surface: #21201c;
    --ink: #f2efe7;
    --muted: #a8a293;
    --line: #37352e;
    --accent: #5fd0a2;
    --accent-soft: #1f3a2f;
    --warn: #f0b15a;
    --warn-soft: #3a2e1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171714;
  --surface: #21201c;
  --ink: #f2efe7;
  --muted: #a8a293;
  --line: #37352e;
  --accent: #5fd0a2;
  --accent-soft: #1f3a2f;
  --warn: #f0b15a;
  --warn-soft: #3a2e1c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
  overflow-wrap: anywhere;
}
main { max-width: 720px; margin-inline: auto; display: grid; gap: 14px; min-width: 0; }
h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0; font-weight: 700; }
.muted { color: var(--muted); font-size: 13px; }
.status { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.status.warn { border-color: var(--warn); background: var(--warn-soft); }
.status code, .meta code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12px; }
.query { display: grid; gap: 10px; min-width: 0; }
.pill { justify-self: start; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: var(--bg); }
.offer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.offer-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.airline { color: var(--muted); font-size: 14px; min-width: 0; }
.price { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.times { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.time { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.1; }
.time.end { text-align: right; }
.track { position: relative; height: 2px; background: var(--line); min-width: 40px; }
.track .label { position: absolute; left: 50%; top: -11px; transform: translateX(-50%); background: var(--surface); padding: 0 6px; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--ink); }
.chip.attn { background: var(--warn-soft); color: var(--warn); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 13px; }
.link { color: var(--accent); font-weight: 600; font-size: 14px; justify-self: start; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { color: var(--muted); font-size: 14px; }
@media (max-width: 420px) {
  .time { font-size: 20px; }
  .times { gap: 6px; }
}
</style>
</head>
<body>
<main>
  <h1>Flight search</h1>
  <section id="envelope" class="status" aria-live="polite" hidden></section>
  <section id="queries" class="query-list"></section>
  <p id="waiting" class="muted">Waiting for the search result from viajante.</p>
</main>
<script>
(function () {
  "use strict";

  var PROTOCOL = "2026-01-26";
  var REQUEST_ID = 1;

  // Plain sentences for each envelope reason. Only provider_empty may read as "none found".
  var REASON_TEXT = {
    provider_empty: "The provider returned no flights for this query.",
    filtered_out: "viajante's filters removed every row the provider returned. Availability is not disproved.",
    not_loaded: "The search did not complete. Availability is unknown."
  };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function parseResult(params) {
    if (!params) return null;
    if (params.structuredContent && typeof params.structuredContent === "object") {
      return params.structuredContent;
    }
    var blocks = params.content || [];
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i] && blocks[i].type === "text") {
        try { return JSON.parse(blocks[i].text); } catch (e) { return null; }
      }
    }
    return null;
  }

  function renderEnvelope(data) {
    var box = document.getElementById("envelope");
    box.textContent = "";
    var lines = [];
    var reason = data.empty_reason;
    if (data.completeness === "partial") {
      lines.push("Partial result: read the rows for each query.");
    }
    if (reason && REASON_TEXT[reason]) lines.push(REASON_TEXT[reason]);
    if (data.error_code) lines.push("Error code: " + data.error_code);
    if (data.retry_after) lines.push("Retry after (UTC): " + data.retry_after);
    if (!lines.length) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    var warn = reason === "not_loaded" || data.completeness === "partial" || data.completeness === "blocked";
    box.className = "status" + (warn ? " warn" : "");
    lines.forEach(function (line) { box.appendChild(el("div", "", line)); });
    var meta = el("div", "muted", "status " + (data.status || "?") + " · completeness " + (data.completeness || "?"));
    box.appendChild(meta);
  }

  function renderOffer(offer) {
    var card = el("article", "offer");
    var head = el("div", "offer-head");
    head.appendChild(el("div", "airline", offer.airline || "Airline not returned"));
    head.appendChild(el("div", "price", offer.price_text || ""));
    card.appendChild(head);

    var times = el("div", "times");
    times.appendChild(el("div", "time", offer.departure || ""));
    var track = el("div", "track");
    var middle = offer.duration || "";
    if (offer.stops) middle = (middle ? middle + " · " : "") + offer.stops;
    track.appendChild(el("span", "label", middle));
    times.appendChild(track);
    times.appendChild(el("div", "time end", offer.arrival || ""));
    card.appendChild(times);

    var chips = el("div", "chips");
    if (typeof offer.stops_count === "number") chips.appendChild(el("span", "chip", offer.stops_count + " stop" + (offer.stops_count === 1 ? "" : "s")));
    if (offer.layover_city) {
      var lay = "via " + offer.layover_city;
      if (typeof offer.layover_hours === "number") lay += " · " + offer.layover_hours + " h";
      chips.appendChild(el("span", "chip", lay));
    }
    if (offer.needs_bag_verify) chips.appendChild(el("span", "chip attn", "Bags: verify"));
    if (chips.childNodes.length) card.appendChild(chips);

    if (offer.flight_numbers && offer.flight_numbers.length) {
      card.appendChild(el("div", "meta", offer.flight_numbers.join(" · ")));
    }
    if (offer.google_flights_url) {
      var link = el("a", "link", "Open in Google Flights");
      link.href = offer.google_flights_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      card.appendChild(link);
    }
    return card;
  }

  function renderQueries(data) {
    var list = document.getElementById("queries");
    list.textContent = "";
    var rows = data.queries || [];
    rows.forEach(function (row) {
      var section = el("section", "query");
      var q = row.query || {};
      var route = [q.origin, q.destination].filter(Boolean).join(" → ") || "Query";
      section.appendChild(el("div", "pill", route));
      var offers = row.offers || [];
      if (!offers.length) {
        var reason = row.empty_reason;
        var text = (reason && REASON_TEXT[reason]) || "No offers in this query.";
        if (row.error && row.error.message) text += " " + row.error.message;
        section.appendChild(el("div", "empty", text));
      }
      offers.forEach(function (offer) { section.appendChild(renderOffer(offer)); });
      list.appendChild(section);
    });
  }

  function render(data) {
    document.getElementById("waiting").hidden = true;
    renderEnvelope(data);
    renderQueries(data);
  }

  // MCP Apps handshake: ui/initialize request, then ui/notifications/initialized.
  // Only the host window may drive the view.
  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) return;
    var msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id === REQUEST_ID && msg.result) {
      window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*");
      return;
    }
    if (msg.method === "ui/notifications/tool-result") {
      var data = parseResult(msg.params);
      if (data) render(data);
    }
  });

  window.parent.postMessage({
    jsonrpc: "2.0",
    id: REQUEST_ID,
    method: "ui/initialize",
    params: {
      protocolVersion: PROTOCOL,
      appInfo: { name: "viajante flights", version: "1" },
      appCapabilities: {}
    }
  }, "*");
})();
</script>
</body>
</html>
