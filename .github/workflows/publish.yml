name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to resume npm and MCP Registry (PyPI is already published)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    # Nothing below can be taken back from PyPI, npm, or the MCP Registry, so the tagged
    # commit has to pass what a pull request passes, and every version pin has to name the tag.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Every version pin matches the tag
        run: python3 scripts/check-release.py "$GITHUB_REF_NAME"
      - run: uv sync --locked --group dev --extra mcp --extra browser
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python -m unittest discover -s tests
        env:
          VIAJANTE_STATE_DIR: ${{ runner.temp }}/viajante-state

  build:
    needs: verify
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - run: uv build --no-sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/viajante/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv publish

  desktop-extension:
    # The extension installs the PyPI release it is pinned to, so it is built after PyPI has it.
    needs: pypi
    if: ${{ !cancelled() && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Pack the extension
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl --fail --silent --show-error "https://pypi.org/pypi/viajante/$version/json" >/dev/null
          npx --yes @anthropic-ai/mcpb@2.1.2 pack mcpb viajante.mcpb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viajante-mcpb
          path: viajante.mcpb
      - name: Attach it to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" viajante.mcpb --clobber
          else
            echo "::notice::No GitHub release for $GITHUB_REF_NAME yet. Attach the viajante-mcpb artifact to it: gh release upload $GITHUB_REF_NAME viajante.mcpb"
          fi

  npm:
    needs: pypi
    if: ${{ !cancelled() && (needs.pypi.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate recovery tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: npm CLI for trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Publish npx shim
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"
          curl --fail --silent --show-error "https://pypi.org/pypi/viajante/$version/json" >/dev/null
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already on npm; skip"
            exit 0
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public
          else
            # An empty setup-node auth entry can prevent npm from using OIDC.
            npm config delete '//registry.npmjs.org/:_authToken' --location=user
            unset NODE_AUTH_TOKEN
            npm publish --access public --provenance
          fi
      - name: Wait for npm registry availability
        working-directory: npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 30); do
            if [ "$(npm view "$name@$version" version --fetch-retries=0 --fetch-timeout=10000 2>/dev/null)" = "$version" ]; then
              exit 0
            fi
            echo "Waiting for $name@$version to become available ($attempt/30)"
            sleep 10
          done
          echo "$name@$version is not available after waiting; skip MCP Registry publication" >&2
          exit 1

  mcp-registry:
    needs: npm
    if: ${{ !cancelled() && needs.npm.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Set registry versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          jq --arg version "$version" \
            '.version = $version | .packages |= map(.version = $version)' \
            server.json > server.tmp
          mv server.tmp server.json
      - name: Install MCP publisher
        # A pinned release and its checksum, not whatever "latest" is when the tag lands.
        # To move to a newer one, download its linux_amd64 tarball and update both lines.
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
          MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
        run: |
          curl --fail --silent --show-error --location --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
