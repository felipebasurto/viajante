name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --no-dev --extra mcp --extra browser
      - run: uv run --no-sync python -m unittest discover -s tests -v

  mcp-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked --no-dev --extra mcp
      - name: Pin the declared minimum SDK
        run: uv pip install 'mcp==1.14.1'
      - name: Stdio MCP smoke on the minimum SDK
        run: uv run --no-sync python scripts/mcp-smoke.py
      - run: PYTHONPATH=tests uv run --no-sync python -m unittest tests.test_mcp tests.test_mcp_compat tests.test_validate_guidance tests.test_envelope -v

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv build
      - name: Install wheel in a venv and smoke CLI plus MCP
        run: |
          uv venv /tmp/viajante-wheel
          WHEEL=$(echo dist/*.whl)
          uv pip install --python /tmp/viajante-wheel "$WHEEL"
          uv pip install --python /tmp/viajante-wheel 'mcp>=1.14.1,<2'
          /tmp/viajante-wheel/bin/viajante airports JFK
          /tmp/viajante-wheel/bin/viajante --version
          /tmp/viajante-wheel/bin/python -c "from importlib.resources import files; t=files('viajante').joinpath('THIRD_PARTY_NOTICES').read_text(); assert 'Permission is hereby granted' in t"
          /tmp/viajante-wheel/bin/python - <<'PY'
          import asyncio
          import json
          from importlib.metadata import version
          from mcp import ClientSession
          from mcp.client.stdio import StdioServerParameters, stdio_client

          async def main() -> None:
              params = StdioServerParameters(command="/tmp/viajante-wheel/bin/viajante-mcp")
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      names = {tool.name for tool in tools.tools}
                      expected = {
                          "search_flights",
                          "search_dates",
                          "search_flex",
                          "search_explore",
                          "search_hotels",
                          "search_hotel_rooms",
                          "search_trip",
                          "lookup_airports",
                          "search_hidden_city",
                          "compare_awards",
                          "lookup_transfers",
                          "validate_itinerary",
                          "recheck_offer",
                          "plan_stay_blocks",
                          "split_stay_costs",
                          "verify_answer",
                          "price_history",
                          "watch_price",
                          "get_runtime_info",
                          "get_guide",
                      }
                      assert names == expected, names ^ expected
                      for tool in tools.tools:
                          assert tool.title and tool.annotations, tool.name
                          writes = tool.name == "watch_price"
                          assert tool.annotations.readOnlyHint is not writes, tool.name
                          assert tool.annotations.idempotentHint is not writes, tool.name
                          assert tool.annotations.destructiveHint is False, tool.name
                          network = tool.name.startswith("search_") or tool.name in {
                              "recheck_offer",
                              "watch_price",
                          }
                          assert tool.annotations.openWorldHint == network, tool.name
                      guide = await session.read_resource("viajante://guide")
                      assert "Rate limits" in guide.contents[0].text
                      hotel = next(tool for tool in tools.tools if tool.name == "search_hotels")
                      assert "max_distance_km" in hotel.inputSchema["properties"]
                      result = await session.call_tool("get_runtime_info", {})
                      assert not result.isError, result
                      runtime = json.loads(result.content[0].text)
                      assert runtime["viajante_version"] == version("viajante"), runtime
                      assert runtime["hotel_schema_version"] == 2, runtime

          asyncio.run(main())
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
